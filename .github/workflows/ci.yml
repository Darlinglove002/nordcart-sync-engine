name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Real PostgreSQL and Redis: the tests check SQL semantics, locks and cache behaviour,
    # which a mock or SQLite would silently get wrong. RabbitMQ is not needed: Celery runs
    # tasks inline (CELERY_EAGER) in tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nordcart
          POSTGRES_PASSWORD: nordcart
          POSTGRES_DB: nordcart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nordcart" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+psycopg://nordcart:nordcart@localhost:5432/nordcart_test
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_SERVICES: "1"   # a missing service fails the build instead of skipping tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -q
