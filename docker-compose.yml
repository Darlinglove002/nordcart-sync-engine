x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env (see .env.example)}
    DATABASE_URL: postgresql+psycopg://nordcart:${POSTGRES_PASSWORD:-nordcart}@db:5432/nordcart
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: amqp://nordcart:${RABBITMQ_PASSWORD:-nordcart}@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nordcart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nordcart}
      POSTGRES_DB: nordcart
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5443}:5432"   # local access only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordcart -d nordcart"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Cache and result backend only: losing it costs a cold cache, never data.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nordcart
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nordcart}
    ports:
      - "127.0.0.1:${RABBIT_HOST_PORT:-5673}:5672"
      - "127.0.0.1:${RABBIT_UI_HOST_PORT:-15673}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  beat:
    <<: *app
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # `docker compose --profile bench run --rm bench` : live SQL vs rollup vs Redis cache over HTTP
  bench:
    profiles: ["bench"]
    <<: *app
    command: ["python", "-m", "benchmarks.bench", "--url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
