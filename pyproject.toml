[project]
name = "nordcart-sync-engine"
version = "0.1.0"
description = "B2B backend for marketplace sellers: synthetic orders/returns/fees, unit-economics dashboard served from Redis, margins recalculated in Celery workers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "celery>=5.4,<6",
    "redis>=5.0,<6",
    "pydantic-settings>=2.3,<3",
]

[project.optional-dependencies]
bench = ["httpx>=0.27,<1"]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL and Redis (docker compose up -d db redis)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# T20: no print() in package code (use logging). The benchmark CLI prints its report, so it is
# exempt; the generator CLI's one-time API keys are marked with an inline noqa and a reason.
select = ["E", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]  # line wrapping is owned by `ruff format`

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

# Celery ships no type information.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
